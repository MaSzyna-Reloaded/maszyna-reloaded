name: build

# The game's tests and its release of each platform, with the double precision Godot fetched from
# libreloaded's release godot-<build>-double - its version with its godot-patches
# (vendor/libreloaded/ci/fetch-godot.sh). libreloaded
# with its plugin libmaszyna (the vendor/libreloaded and vendor/libmaszyna submodules) is built
# into this project by the Makefile's own rules: the tests' and the exporting editor's library
# (compile-debug) once, by build-host, and handed to the other jobs; the Windows and Android release
# libraries cross-compiled on the runner, the Linux one in libreloaded's ci/docker/linux-sdk for an
# old glibc. The games are published as a GitHub release: a pull request keeps one
# prerelease per branch (maszyna-reloaded-<branch>), main one nightly prerelease
# (maszyna-reloaded-nightly), a release/<name> branch one release candidate
# (maszyna-reloaded-rc-<name>), and a pushed tag on main gets a release of its own
# (maszyna-reloaded-<tag>). The maszyna-reloaded-* tags are all of them and made by CI itself.
# Discord hears of the nightly, the candidates and the tags' releases from the publish job (the
# DISCORD_RELEASES_WEBHOOK secret), never of a pull request's prerelease.
on:
  pull_request:
  push:
    # main is the nightly's branch until devel takes its place
    branches:
      - main
      - 'release/**'
    tags:
      - '**'
      - '!maszyna-reloaded-*'
  workflow_dispatch:

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # the directory ccache-action keeps; libreloaded's Makefile mounts it into the Linux SDK container
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  # the build number of the whole run and the host library (template_debug), each made once: every
  # platform's game and the installer carry the same number, the tests and every export's editor
  # load the same library
  build-host:
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.build-number.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # cmake/write_build_number.cmake
      - name: Build number
        id: build-number
        run: |
          make build-number
          echo "value=$(cat build_number.txt)" >> "$GITHUB_OUTPUT"

      - name: Fetch the double precision Godot
        run: |
          vendor/libreloaded/ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: host

      # the empty overrides leave out the clang-tidy database compile-debug prepares for the IDE
      - name: Build the host library
        run: make compile-debug CLANG_TIDY_COMPILE_COMMANDS_FILE= CLANG_TIDY_BINDINGS_FILE=

      # and maszyna-python-host, the process PythonScreenServer runs CPython in, the
      # libreloaded.gdextension CMake generates into libreloaded's addon - not versioned, and without
      # it Godot loads no library - and gnd-sfx's library libreloaded's build makes beside its own;
      # kept by their paths from the repository's root
      - uses: actions/upload-artifact@v7
        with:
          name: host-library
          path: |
            bin/libreloaded/linux/libreloaded.debug.64.so
            bin/libreloaded/linux/maszyna-python-host.64
            vendor/libreloaded/addons/libreloaded/libreloaded.gdextension
            vendor/libreloaded/vendor/gnd-sfx/addons/gnd_sfx/bin/linux/libgndsfx.linux.template_debug.double.x86_64.so
          if-no-files-found: error

  run-tests:
    needs: build-host
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch the double precision Godot
        run: |
          vendor/libreloaded/ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: host-library
          path: .

      # an artifact does not keep the executable bit
      - name: Make the Python host executable
        run: chmod +x bin/libreloaded/linux/maszyna-python-host.64

      # Terrain3D patched and built: reloaded-terrain's release
      - name: Fetch Terrain3D
        run: make terrain3d

      # addons/libreloaded, addons/gnd_sfx and addons/libmaszyna are not versioned: they lead to the
      # submodules
      - name: Link the addons
        run: make links

      - name: Import the project
        run: godot-double --headless --path . --import

      # GUT skips a test script that does not parse with only a warning and does not count it, so
      # the run fails on the engine's own message for it; pipefail keeps GUT's own exit code, which
      # tee would otherwise replace with its own success
      - name: Run the tests
        run: |
          set -o pipefail
          godot-double --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/ -gexit -gjunit_xml_file=res://test_results.xml 2>&1 | tee gut.log
          ! grep "Failed to load script" gut.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gut-test-results
          path: test_results.xml

  build:
    needs: build-host
    # packages: the Windows installer image, published to ghcr.io when its tag is not there yet
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            templates: godot.linuxbsd.template_release.double.x86_64
            output: bin/linux/maszyna-reloaded-linux64.zip
          - platform: windows
            arch: x86_64
            templates: godot.windows.template_release.double.x86_64.exe
            # the zip and the installer beside it
            output: bin/windows/maszyna-reloaded-win64*
          - platform: android
            arch: arm64
            templates: android_release.apk
            output: bin/android/maszyna-reloaded-android-arm64.apk
    runs-on: ubuntu-24.04
    steps:
      # a pull request is built from its branch's own commit, not from GitHub's merge with main
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      # the build number the game shows and the installer carries, the one build-host stamped
      - name: Build number
        env:
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: printf '%s' "$BUILD_NUMBER" > build_number.txt

      - uses: actions/download-artifact@v8
        with:
          name: host-library
          path: .

      # an artifact does not keep the executable bit
      - name: Make the Python host executable
        run: chmod +x bin/libreloaded/linux/maszyna-python-host.64

      - name: Fetch the double precision Godot
        run: |
          vendor/libreloaded/ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64 ${{ matrix.templates }}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install MinGW
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      # a throwaway key: a release APK has to be signed, and this build is for testing - a published
      # APK is signed elsewhere
      - name: Create the release keystore
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias maszyna \
            -storepass maszyna -keypass maszyna -keyalg RSA -validity 1 -dname CN=maszyna
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=maszyna"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=maszyna"
          } >> "$GITHUB_ENV"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.platform }}

      # the exporting editor loads build-host's library: -o keeps make from building it again
      # Terrain3D patched and built: reloaded-terrain's release
      - name: Fetch Terrain3D
        run: make terrain3d

      # The Windows installer is made in an image tagged by its Dockerfile; a changed Dockerfile is a
      # tag not on ghcr.io yet, so CI builds it once and publishes it, and later runs pull it. A pull
      # request from a fork has a read-only token: it builds the image for itself
      - name: Publish the Windows installer image
        if: matrix.platform == 'windows' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          make windows-installer-image-push

      # addons/libreloaded and addons/libmaszyna are not versioned: they lead to the submodules
      - name: Link the addons
        run: make links

      - name: Build and export ${{ matrix.platform }}
        run: make -o compile-debug release-${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: game-${{ matrix.platform }}-template_release-${{ matrix.arch }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  # The games the builds exported (game-<platform>-<target>-<arch>), named with the release and the
  # build number; nothing is built again here. A pull request publishes them as the branch's
  # prerelease (maszyna-reloaded-<branch>, "/" as "-") on its own commit, a push on main as the
  # nightly (maszyna-reloaded-nightly), on release/<name> as its candidate
  # (maszyna-reloaded-rc-<name>) - each a prerelease whose files every push replaces; a tag pushed
  # on main as its release (maszyna-reloaded-<tag>, files without the build number). A pull request
  # from a fork has a read-only token and keeps only the artifacts.
  publish:
    needs: [build-host, build]
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: game-*
          path: artifacts

      - name: Name the release
        id: release
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*) name="$BRANCH" ;;
            push:refs/tags/*) name="$GITHUB_REF_NAME" ;;
            push:refs/heads/release/*) name="rc-${GITHUB_REF_NAME#release/}" ;;
            push:refs/heads/*) name=nightly ;;
          esac
          echo "value=maszyna-reloaded-${name//\//-}" >> "$GITHUB_OUTPUT"

      # each game as <release>-<build>-<platform>-<target>-<arch>.zip or .apk, the Windows installer
      # as <release>-<build>-windows-setup.exe
      - name: Name the files
        env:
          RELEASE: ${{ steps.release.outputs.value }}
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: |
          mkdir release
          # a tag's release is the tag's name alone; a prerelease carries the build number
          prefix="$RELEASE"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            prefix="$prefix-$BUILD_NUMBER"
          fi
          for dir in artifacts/game-*; do
            for file in "$dir"/*; do
              case "$file" in
                *-setup.exe) cp "$file" "release/$prefix-windows-setup.exe" ;;
                *) cp "$file" "release/$prefix-${dir#artifacts/game-}.${file##*.}" ;;
              esac
            done
          done
          test -f "release/$prefix-windows-setup.exe"
          ls -l release

      - name: Publish the prerelease
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ steps.release.outputs.value }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.number }}
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: |
          # the pull request's number, or the branch pushed
          source="${PR_NUMBER:+#$PR_NUMBER}"
          # the tag is moved to the commit just built: the old release goes with its tag
          gh release delete "$RELEASE" --cleanup-tag --yes || true
          gh release create "$RELEASE" release/* --prerelease --target "$SHA" \
            --title "$RELEASE" --notes "Build $BUILD_NUMBER of $SHA (${source:-$GITHUB_REF_NAME})"

      - name: Publish the tag release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE: ${{ steps.release.outputs.value }}
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: |
          # only a tag on main is released: main has to contain the tagged commit
          status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG is not on main" >&2
            exit 1
          fi
          # released as maszyna-reloaded-<tag>, a tag of CI's own on the same commit (the trigger leaves
          # maszyna-reloaded-* out); a rerun finds the release already there and only replaces its files
          gh release create "$RELEASE" --target "$GITHUB_SHA" --title "$RELEASE" \
            --notes "Build $BUILD_NUMBER of $GITHUB_SHA, tag $TAG" --generate-notes \
            || gh release view "$RELEASE" > /dev/null
          gh release upload "$RELEASE" release/* --clobber

      # the nightly, a release candidate and a tag's release; the repository's own webhook is not
      # subscribed to releases, which would announce every pull request's prerelease as well
      - name: Announce on Discord
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          RELEASE: ${{ steps.release.outputs.value }}
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: |
          url=$(gh release view "$RELEASE" --json url --jq .url)
          jq -n --arg content "**$RELEASE** - build $BUILD_NUMBER"$'\n'"$url" '{content: $content}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK"
